<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>

    <link rel="stylesheet" href="../static/css/auth.css">

    <link rel="icon" type="image/png" href="{{ url_for('static', path='images/favicon.png') }}">

    <title>Login Page</title>
</head>

<body>

    <div class="title-card-container">
        <div class="title-card-content">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
        </div>
        <h1>Diabetes Prediction System</h1>
        <p>Early Detection & Data-Driven Risk Assessment</p>
    </div>

    <div class="login-container">

        <h1 class="login-title">User Login</h1>
        <p class="subtitle">Sign in to continue</p>

        <form id="login-form">

            <div class="input-box">
                <span class="material-symbols-outlined icon">
                    email
                </span>

                <input
                    id="email"
                    type="email"
                    placeholder="example@email.com"
                    required>
            </div>

            <div class="input-box">
                <span class="material-symbols-outlined icon">
                    password
                </span>

                <input
                    id="password"
                    type="password" 
                    placeholder="Password"
                    required>

                <button id="toggle"   class="icon-button" type="button">
                    <span id="vis" class="material-symbols-outlined icon-right">
                        visibility_off
                    </span>
                </button>
            </div>
            <button type="submit">
                Sign In
            </button>
            <p id="error-message"></p>
        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="/register">Sign Up</a>
        </p>

    </div>
</div>
<script src="../static/js/login.js"></script>
</body>
</html>
