<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" type="image/png" href="{{ url_for('static', path='images/favicon.png') }}">
        <link rel="stylesheet" href="../static/css/predict.css">


        <title>Prediction Page</title>
    </head>

    <body>
        <!--Check for token-->
        <script>
            const token = localStorage.getItem("token");

            if(!token) {
                window.location.replace("http://127.0.0.1:8000/login");
                alert("Please Log In");
            }

        </script>

        {% include "components/sidebar.html" %}

        <div class="predict-container">
            <h1 class="predict-title";">Prediction</h1>
            <form id="predict-form">

                <!--Gender input-->
                <div class="input-box">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>

                <!--Age input-->
                </div>
                <div class="input-box">
                    <input
                    id="age"
                    type="number"
                    min="1"
                    max="120"
                    step="1"
                    placeholder="Age"
                    required>
                </div>

                <!--Hypertension input-->
                <div>
                    Hypertension
                    <label>
                        <input type="radio" name="hypertension" value="1" required>
                            Yes
                    </label>

                    <label>
                        <input type="radio" name="hypertension" value="0">
                            No
                    </label>
                </div>

                <!--Heart Disease input-->
                <div>
                    Heart Disease
                    <label>
                        <input type="radio" name="heart_disease" value="1" required>
                            Yes
                    </label>

                    <label>
                        <input type="radio" name="heart_disease" value="0">
                            No
                    </label>
                </div>

                <!--Smoking input-->
                <div>
                    <label for="smoking_history">Smoking History</label>
                    <select id="smoking_history" name="smoking_history">
                        <option value="current">Current</option>
                        <option value="former">Former</option>
                        <option value="never">Never</option>
                        <option value="not current">Not current</option>
                        <option value="No Info">No Info</option>
                    </select>
                </div>

                <!--BMI input-->
                <div class="input-box">
                    <input 
                    id="bmi"
                    type="number"
                    min="10"
                    max="90"
                    step="0.1"
                    placeholder="BMI"
                    required>

                </div>

                <!--HbA1c input-->
                <div class="input-box">
                    <input
                    id="HbA1c_level"
                    type="number"
                    step="0.1"
                    placeholder="HbA1c level"
                    required>
                </div>

                <!--Glucose input-->
                <div class="input-box">
                    <input
                    id="blood_glucose_level"
                    type="number"
                    min="1"
                    max="800"
                    step="1"
                    placeholder="Blood Glucose Level"
                    required>
                </div>

                <!--Button-->
                <button type="submit" style="margin-top: 10px;">
                    Predict
                </button>
                <p id="error-message"></p>
                <p id="prediction"></p>

            </form>

        </div>
        <script src="../static/js/predict.js"></script>
    </body>

</html>
